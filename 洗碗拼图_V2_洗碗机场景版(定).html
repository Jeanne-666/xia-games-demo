<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洗得下，也洗得到 · V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#eddbc4;color:#574735;font:18px/1.5 system-ui,'Microsoft Yahei',sans-serif}main{max-width:570px;margin:auto;min-height:100dvh;padding:18px;background:#fff8e9}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}h2{font-size:24px;margin:4px 0 14px}small{font-size:13px;color:#8e7961}button{font:inherit;color:inherit;border:1px solid #d9c4a4;background:#fffdf5;border-radius:14px;min-height:50px;padding:9px 13px;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #846045;outline-offset:2px}button:disabled{opacity:.45}.primary{background:#b77e54;color:#fff;border:0}.stats{display:flex;justify-content:space-between;font-size:15px;margin:16px 0 9px}.rack{position:relative;display:grid;gap:5px;background:repeating-linear-gradient(0deg,#c5c3b2 0 3px,#e2ddcb 3px 24px);border:10px solid #e0c8a2;box-shadow:0 6px 0 #c5ab85;border-radius:19px;padding:8px;margin:12px 0 20px}.cell{padding:0;aspect-ratio:1;min-height:0;border-radius:9px;background:#fff9e499;border:1px solid #bca887;position:relative;display:grid;place-items:center;overflow:hidden}.cell.empty{color:#9d8a6e;font-size:25px}.cell.used{border-width:2px}.cell.block{background:#b9c3c0;color:#536a70;border:2px dashed #6f8d92}.cell svg{width:80%;height:80%;pointer-events:none}.cell .tiny{font-size:11px;position:absolute;bottom:0;left:0;right:0;text-align:center;background:#fff9e8d9}.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.piece{padding:7px 4px;display:flex;flex-direction:column;align-items:center;font-size:14px;min-height:105px}.piece svg{height:48px;width:70px}.piece.active{outline:3px solid #b77e54;background:#f7e2bd}.piece.placed{opacity:.6;background:#e5ead8}.shape{display:inline-grid;gap:2px;vertical-align:middle;margin:5px}.shape i{display:block;width:12px;height:12px;border-radius:2px;background:#be9871}.shape i.off{background:transparent}.controls{display:flex;gap:8px;margin:12px 0}.controls button{flex:1}.message{padding:11px 14px;background:#f0e2ca;border-radius:14px;margin:12px 0;min-height:65px;font-size:16px}.preview{background:#fff4dc;padding:10px;border-radius:14px;display:flex;align-items:center;justify-content:space-between}.caption{font-size:12px;color:#8e7d66;margin-top:14px}.flow .cell.used:after{content:'↑';position:absolute;inset:0;color:#547e91;font-size:30px;opacity:.7;pointer-events:none;animation:water 1.4s infinite}.flow .cell.block:after{content:'↟';font-size:29px;color:#456e80;position:absolute;inset:0;pointer-events:none}@keyframes water{50%{transform:translateY(-8px);opacity:.3}}dialog{border:0;border-radius:24px;background:#fff8e9;color:#574735;padding:25px;width:calc(100% - 32px);max-width:440px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#4f3b3066}dialog button{width:100%;margin-top:10px}.note{background:#eadbb9;padding:20px;border-radius:10px}.compact{font-size:14px}@media(max-width:370px){main{padding:12px}.tray{gap:6px}.piece{font-size:13px}h1{font-size:22px}.controls button{font-size:15px;padding:9px 6px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.preview{position:sticky;top:0;z-index:5;display:block;border:2px solid #bd956a;box-shadow:0 4px 15px #6e4d2915}.preview strong{display:block;font-size:19px}.preview #shape{display:flex;gap:18px;align-items:center;min-height:85px}.preview #shape>svg{width:80px;height:75px}.preview .shape i{width:25px;height:25px}.preview #confirm{width:100%}.tray .shape{--shape-unit:13px}.tray .shape i{width:13px;height:13px}.piece{min-height:133px}.dishwasher{margin:16px 0;border:6px solid #b5b5a9;border-radius:18px;background:#c5c7bd;overflow:hidden;box-shadow:0 8px 0 #a59b85}.machine-top{display:flex;justify-content:space-between;padding:12px;background:linear-gradient(#eee9dc,#c9c9bf);font-size:13px;border-bottom:5px solid #90998e}.cavity{padding:6px;background:linear-gradient(90deg,#848f85,#bfc5b9 15%,#d7dacc 85%,#8c978b);border:7px solid #d3d7ca}.rack{border:5px solid #8d9c92;border-radius:4px;margin:5px 0 10px;box-shadow:0 6px 0 #687e7055;background:repeating-linear-gradient(0deg,#a2aea1 0 3px,#e6e9dc 3px 22px)}.door-front{height:75px;background:linear-gradient(#d6d8ce,#ede8db);position:relative;border-top:5px solid #86978a;box-shadow:inset 0 3px 9px #6a756733}.soap{position:absolute;left:20px;top:15px;border:2px solid #a3ab9c;border-radius:5px;padding:5px;font-size:12px;background:#c4cbbd}.handle{position:absolute;right:20px;top:18px;width:70px;height:9px;background:#a6ad9f;border-radius:10px}.cell.ghost{background:#ecc585!important;outline:3px dashed #a67437;outline-offset:-5px}.water-report:empty{display:none}.water-report{padding:12px;background:#e0ebed;color:#496b76;border-radius:12px;margin-bottom:12px}.flow.blocked-flow .cell.used:after{content:'×';animation:none;color:#b2694c;background:#ecc8b045}.cell.flow-error{outline:4px solid #b45c45;outline-offset:-4px}.shape i{flex-shrink:0}</style>
<main><header><div><small>从家出发 · 洗碗玩法实验 V2</small><h1>洗得下，也洗得到</h1></div><button id="help">指南</button></header><div class="stats"><span id="level"></span><span id="progress"></span></div><div id="message" class="message" role="status" aria-live="polite"></div><div class="preview"><strong id="selected">先选一件餐具</strong><div id="shape"></div><button id="confirm" class="primary">确认放这里</button></div><div class="dishwasher"><div class="machine-top"><span>●　家庭洗碗机</span><span>▰　▰　◉</span></div><div class="cavity"><div class="rack" id="rack" aria-label="拉出的洗碗机碗篮"></div></div><div class="door-front"><span class="soap">洗涤剂盒 ▣</span><span class="handle"></span></div></div><div id="waterReport" class="water-report" role="status"></div><div class="controls"><button id="rotate">↻ 旋转</button><button id="undo">撤回一步</button><button id="reset">重新摆放</button></div><div class="tray" id="tray"></div><div class="controls"><button id="water">查看水流</button><button id="wash" class="primary">安排清洗 →</button></div><p class="caption">玩法原型：格子是简化的摆放空间，并非真实餐具尺寸或喷淋模拟。真实装载以自家设备说明书为准。不计时、不扣尝试次数。</p></main><dialog id="modal"></dialog><script>
const $=id=>document.getElementById(id);const defs={cup:{name:'杯子',shape:[[0,0]],color:'#d6b692'},bowl:{name:'小碗',shape:[[0,0],[1,0]],color:'#a9bbb0'},plate:{name:'餐盘',shape:[[0,0],[1,0],[2,0]],color:'#adc0ce'},tray:{name:'长烤盘',shape:[[0,0],[1,0],[2,0],[3,0]],color:'#c3aaa3'},set:{name:'餐碟组合',shape:[[0,0],[0,1],[1,1]],color:'#d0bf8e'}};
const levels=[{title:'第一关 · 给大盘留个位置',w:4,h:3,items:['cup','plate','bowl','cup'],blocked:[]},{title:'第二关 · 转个方向，就放得下',w:4,h:3,items:['cup','tray','set','bowl','cup'],blocked:[]},{title:'第三关 · 留出喷水的位置',w:4,h:4,items:['tray','plate','set','bowl','cup','cup'],blocked:[5,9]}];let candidate=null;let level=0,pieces=[],selected=null,history=[],flow=false,solved=false,rotations=0,adjustments=0;
function svg(type,color){const p={cup:'<path d="M20 18h40v40q-20 20-40 0z"/><path d="M60 25q30-5 17 23H60" fill="none"/><ellipse cx="40" cy="18" rx="20" ry="7" fill="#fff5df"/>',bowl:'<path d="M12 27h66q-3 42-33 42T12 27"/><ellipse cx="45" cy="27" rx="33" ry="10" fill="#f7efda"/>',plate:'<ellipse cx="45" cy="43" rx="35" ry="29"/><ellipse cx="45" cy="43" rx="25" ry="20" fill="#f6f3e8"/>',tray:'<rect x="9" y="18" width="72" height="51" rx="9"/><rect x="16" y="25" width="58" height="37" rx="5" fill="#f4e9d7"/>',set:'<circle cx="29" cy="27" r="19"/><circle cx="29" cy="61" r="19"/><circle cx="64" cy="61" r="19"/>'};return '<svg viewBox="0 0 90 85" aria-hidden="true"><g fill="'+color+'" stroke="#9a856c" stroke-width="2">'+p[type]+'</g></svg>'}
function shape(p){let a=defs[p.type].shape.map(c=>[...c]);for(let i=0;i<p.rot;i++)a=a.map(([x,y])=>[-y,x]);let minX=Math.min(...a.map(c=>c[0])),minY=Math.min(...a.map(c=>c[1]));return a.map(([x,y])=>[x-minX,y-minY])}function occupied(p){return p.pos===null?[]:shape(p).map(([x,y])=>[x+p.pos%cfg().w,y+Math.floor(p.pos/cfg().w)])}function cfg(){return levels[level]}function tell(t){$('message').textContent=t}function snapshot(){history.push(JSON.stringify({pieces,selected,rotations,adjustments}));if(history.length>100)history.shift()}function popup(html){$('modal').innerHTML=html;$('modal').showModal()}function close(){$('modal').close()}
function render(){let c=cfg(),placed=pieces.filter(p=>p.pos!==null).length;$('level').textContent=c.title;$('progress').textContent=placed+' / '+pieces.length+' 件已放';$('rack').style.gridTemplateColumns='repeat('+c.w+',1fr)';$('rack').className='rack '+(flow?(waterBlocked()?'flow blocked-flow':'flow'):'');$('rack').innerHTML=Array.from({length:c.w*c.h},(_,i)=>{let p=pieces.find(p=>occupied(p).some(([x,y])=>x===i%c.w&&y===Math.floor(i/c.w))),anchor=p&&p.pos===i;return '<button class="cell '+(p?'used':c.blocked.includes(i)?'block':'empty')+(candidate!==null&&selected!==null&&previewCells(candidate).includes(i)?' ghost':'')+(flow&&waterBlocked()&&c.blocked.includes(i)?' flow-error':'')+'" data-cell="'+i+'" style="'+(p?'background:'+defs[p.type].color+'77;border-color:'+defs[p.type].color:'')+'" aria-label="第'+(Math.floor(i/c.w)+1)+'行第'+(i%c.w+1)+'列，'+(c.blocked.includes(i)?'喷淋留空区':p?defs[p.type].name:'空位')+'">'+(p?anchor?svg(p.type,defs[p.type].color):'':c.blocked.includes(i)?'↟':'＋')+(anchor?'<span class="tiny">'+defs[p.type].name+'</span>':'')+'</button>'}).join('');document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>place(+b.dataset.cell));$('tray').innerHTML=pieces.map((p,i)=>'<button class="piece '+(selected===i?'active':'')+' '+(p.pos!==null?'placed':'')+'" data-piece="'+i+'">'+svg(p.type,defs[p.type].color)+defs[p.type].name+shapeDiagram(p)+'<small>'+(p.pos!==null?'已放 · 点选可重摆':'点击选择')+'</small></button>').join('');document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>select(+b.dataset.piece));let p=pieces[selected];$('selected').textContent=p?defs[p.type].name+' · 占 '+shape(p).length+' 格':'先选一件餐具';$('shape').innerHTML=p?svg(p.type,defs[p.type].color)+shapeDiagram(p):'<small>① 选餐具 → ② 点空位预览 → ③ 确认</small>';$('confirm').disabled=candidate===null||selected===null||!canFit(candidate);$('confirm').textContent=candidate===null?'先点空位预览':'确认放这里';$('waterReport').textContent=flow?(waterBlocked()?'喷淋臂被餐具占住，无法正常转动。拿回遮挡位置的餐具，再试水。':'喷淋区畅通 ✓ 水流可以覆盖已放餐具。'+(pieces.some(p=>p.pos===null)?' 外面还有餐具尚未放入。':'')):'';$('rotate').disabled=!p||solved;$('undo').disabled=!history.length||solved;$('water').textContent=flow?'关闭水流':'查看水流';$('wash').disabled=solved}
function shapeDiagram(p){let a=shape(p),w=Math.max(...a.map(c=>c[0]))+1,h=Math.max(...a.map(c=>c[1]))+1;return '<span class="shape" style="grid-template-columns:repeat('+w+',var(--shape-unit,25px))">'+Array.from({length:w*h},(_,i)=>'<i class="'+(a.some(([x,y])=>x===i%w&&y===Math.floor(i/w))?'':'off')+'"></i>').join('')+'</span>'}
function select(i){if(solved)return;candidate=null;snapshot();selected=i;if(pieces[i].pos!==null){pieces[i].pos=null;adjustments++;tell('已拿回'+defs[pieces[i].type].name+'。可以旋转或换个位置。')}else tell('已选'+defs[pieces[i].type].name+'：小方格显示它占的位置。点空位作为左上角放下。');render()}
function commitPlace(i){if(solved)return;let existing=pieces.findIndex(p=>occupied(p).some(([x,y])=>y*cfg().w+x===i));if(existing>=0){select(existing);return}if(selected===null)return tell('先从下方选一件餐具。');let p=pieces[selected],x0=i%cfg().w,y0=Math.floor(i/cfg().w);let cells=shape(p).map(([x,y])=>[x+x0,y+y0]);if(cells.some(([x,y])=>x>=cfg().w||y>=cfg().h))return tell('这里放不下，可以旋转，或换一个起点。');if(cells.some(([x,y])=>pieces.some(o=>o!==p&&occupied(o).some(([a,b])=>a===x&&b===y))))return tell('有位置被占住了。可以拿回前面的餐具重新安排。');snapshot();p.pos=i;selected=null;tell('放好了。看看下一件需要多大空间。');render()}
function previewCells(i){if(selected===null)return [];return shape(pieces[selected]).map(([x,y])=>[x+i%cfg().w,y+Math.floor(i/cfg().w)]).filter(([x,y])=>x<cfg().w&&y<cfg().h).map(([x,y])=>y*cfg().w+x)}
function canFit(i){if(selected===null||i===null)return false;let cells=previewCells(i);return cells.length===shape(pieces[selected]).length&&!cells.some(c=>pieces.some((p,j)=>j!==selected&&occupied(p).some(([x,y])=>y*cfg().w+x===c)))}
function waterBlocked(){return pieces.some(p=>occupied(p).some(([x,y])=>cfg().blocked.includes(y*cfg().w+x)))}
function place(i){if(solved)return;let owner=pieces.findIndex(p=>occupied(p).some(([x,y])=>y*cfg().w+x===i));if(owner>=0){select(owner);return}if(selected===null)return tell('先在下方选择餐具，查看放大的占位形状。');candidate=i;render();tell(canFit(i)?'浅色虚影是将要占用的位置。确认合适后，再按“确认放这里”。':'这个位置有重叠或超出边界。换个空位，或旋转后再预览。')}
function begin(l){candidate=null;level=l;pieces=cfg().items.map(type=>({type,pos:null,rot:0}));selected=null;history=[];flow=false;solved=false;rotations=adjustments=0;close();render();tell(['第一关：先看看大盘需要的连续空间，再安排小件。','第二关：这一篮正好装满。可以旋转，也可以拿回重摆。','第三关：带箭头的两格需要留空。其他位置可以有多种摆法。'][l])}
$('confirm').onclick=()=>{if(!canFit(candidate))return;let i=candidate;candidate=null;commitPlace(i)};$('rotate').onclick=()=>{candidate=null;if(selected===null||solved)return;snapshot();pieces[selected].rot=(pieces[selected].rot+1)%4;rotations++;render();tell('方向已调整。点空位试着放下。')};$('undo').onclick=()=>{if(!history.length)return;Object.assign({});let h=JSON.parse(history.pop());pieces=h.pieces;selected=h.selected;rotations=h.rotations;adjustments=h.adjustments;render();tell('已撤回上一步。')};$('reset').onclick=()=>{popup('<h2>重新摆这一篮？</h2><p>只清空当前关，不必重玩前面的关卡。</p><button class="primary" id="yes">重新摆放</button><button id="no">保留进度</button>');$('yes').onclick=()=>begin(level);$('no').onclick=close};$('water').onclick=()=>{flow=!flow;render();tell(flow?(waterBlocked()?'发现遮挡：红色位置占住了喷淋臂。调整后可再次试水。':'试水通过：喷淋区畅通。蓝色表示已放餐具的清洗覆盖。'):'水流示意已关闭，继续调整摆放。')};$('wash').onclick=()=>{if(waterBlocked()){flow=true;render();tell('喷淋臂被挡住了，请先调整遮挡再安排清洗。');return}if(pieces.some(p=>p.pos===null)){tell('还有餐具留在外面。可以继续摆，也可以拿回前面的餐具调整。');return}solved=true;flow=true;render();popup('<div class="note"><small>第'+(level+1)+'关 · 安排完成</small><h2>这一篮，刚刚好。</h2><p>'+pieces.length+' 件餐具都有自己的位置。</p><p class="compact">旋转 '+rotations+' 次 · 拿回调整 '+adjustments+' 次<br>调整也是解题的一部分，没有扣分。</p></div><button id="next" class="primary">'+(level<2?'进入下一关 →':'三关完成，再玩一次')+'</button><button id="again">重摆本关</button>');$('next').onclick=()=>begin(level<2?level+1:0);$('again').onclick=()=>begin(level)};$('help').onclick=()=>{popup('<h2>给下一件留出空间</h2><p>① 点击餐具，查看占位形状。<br>② 看大号占位图，旋转方向。<br>③ 点击空位查看虚影，再按“确认放这里”。</p><p>点已放的餐具可拿回重摆。随时撤回，不限时间。</p><p class="compact">本题把空间关系做成拼图；实际洗碗机不是俄罗斯方块，餐具需留水流间隙，按说明书装载。</p><button id="back">继续摆放</button>');$('back').onclick=close};begin(0);popup('<small>暖色空间拼图 · V2</small><h2>为每一件餐具，留个位置。</h2><p>点选、旋转、放下。<br>放不下时，拿回来换一种安排。</p><p class="compact">没有倒计时，多种摆法都能成功。</p><button class="primary" id="start">开始摆第一篮 →</button>');$('start').onclick=close;
</script></html>
