<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洗烘搭档 · 暖色试玩 V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecd9bf;color:#554535;font:18px/1.55 system-ui,'Microsoft Yahei',sans-serif}main{max-width:560px;min-height:100dvh;margin:auto;background:#fff8e9;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}h2{font-size:24px;margin:0 0 12px}p{margin:8px 0}small,.muted{color:#8b775f;font-size:13px}button{font:inherit;min-height:52px;border:1px solid #dac6a6;border-radius:16px;background:#fffdf7;color:#594736;padding:10px 15px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #936449;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{background:#b77e54;color:#fff;border:0}.stats{display:flex;justify-content:space-between;margin:16px 0 8px;font-size:15px}.bar{height:7px;background:#e9d9c0;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#c39766;transition:width .3s}.scene{position:relative;background:linear-gradient(155deg,#f6e2ba,#e6c99d);border:7px solid #f4e4c8;border-radius:24px;display:flex;align-items:center;justify-content:space-around;padding:12px;margin:16px 0}.washer{width:100px;height:108px;background:#fff9e9;border:5px solid #dfcbae;border-radius:12px;box-shadow:5px 5px 0 #ac805723;position:relative}.washer:before{content:'●  ━━';font-size:12px;color:#a3886a;position:absolute;left:9px;top:1px}.drum{width:65px;height:65px;border:8px solid #d9c5a8;border-radius:50%;background:#aabbb5;margin:23px auto 0;display:grid;place-items:center;color:#fff;font-size:19px}.spin{animation:rotate 1.5s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}.basket{width:140px;background:repeating-linear-gradient(0deg,#d3ae7f 0 5px,#e2c69e 5px 10px);border:4px solid #c6a172;border-radius:6px 6px 24px 24px;padding:12px 7px;text-align:center;font-size:14px}.message{min-height:64px;background:#f0e2ca;padding:12px;border-radius:15px;margin:12px 0;font-size:16px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:155px;padding:8px 5px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffdf6;border:2px solid #dfc7a3;transition:background .2s}.card svg{width:68px;height:65px;display:block;flex-shrink:0}.card .name{font-size:15px}.back{background:repeating-linear-gradient(45deg,#edddc2 0 10px,#f3e5ce 10px 20px);color:#a0805c}.back .number{font-size:27px;line-height:1.1}.card .tag{font-size:14px;padding:3px 9px;border-radius:8px;background:#f3e3c6;line-height:1.4}.matched{background:#e7edda;border-color:#b5c09a;opacity:.7}.matched:after{content:'已成批 ✓';position:absolute;inset:0;background:#eaf0dce8;border-radius:13px;display:grid;place-items:center;font-size:19px;color:#62784e}.selected{border:3px solid #b77e54;background:#fff0d2}.actions{display:flex;gap:10px;margin:15px 0}.actions button{flex:1}.caption{font-size:12px;color:#8e7e68}.overlay{position:fixed;inset:0;background:#59463166;z-index:10;display:grid;place-items:center;padding:18px}.panel{max-width:460px;width:100%;max-height:90dvh;overflow:auto;border-radius:26px;background:#fff8e9;padding:25px;text-align:center;box-shadow:0 15px 80px #432f3722}.panel .actions{flex-direction:column}.hidden{display:none!important}.batch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.batch span{font-size:13px;padding:5px 10px;background:#e6ead6;border-radius:10px}.legend{font-size:16px;text-align:left;border:1px solid #dbc9ab;border-radius:14px;padding:12px;margin:10px 0}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.result div{background:#f1e2c9;padding:12px;border-radius:13px}.result strong{display:block;font-size:26px}.compact .card{min-height:125px}.compact .card svg{height:48px}.compact .card .name{font-size:14px}@media(max-width:380px){main{padding:12px}.cards{gap:8px}.card{min-height:145px}.card .tag{font-size:13px}.scene{padding:8px}.compact .card{min-height:118px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.care-badges{display:flex;gap:7px;margin-top:5px}.care-badge{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:3px 7px;font-size:12px;line-height:1.2;min-width:56px;border:1px solid #dfc6a7}.care-badge svg{width:35px!important;height:35px!important}.care-badge.wash{background:#e5d9bf;color:#78603b}.care-badge.gentle{background:#dce8d7;color:#526c4f}.care-badge.dry{background:#f5d6b1;color:#915a31}.care-badge.air{background:#dce8ee;color:#506f80}.compact .card{min-height:146px}.card .name{font-size:13px;color:#82735c}.legend .care-badges{justify-content:center}</style>
<main><header><div><small>从家出发 · 洗衣玩法实验 V2</small><h1>给衣物找个搭档</h1></div><button id="guide" aria-label="查看生活指南">指南</button></header><div class="stats"><span id="level">第一关</span><span id="progress">0 / 2 批</span></div><div class="bar"><div id="bar"></div></div><div class="scene"><div class="washer"><div class="drum" id="drum">◌</div></div><div><small>今天的待洗衣物</small><div class="basket" id="basket">找到相容搭档</div></div></div><div class="message" id="message" role="status" aria-live="polite">翻开两件衣物，看它们能否使用相同洗烘程序。</div><div class="cards" id="cards"></div><div class="batch" id="batches"></div><div class="actions"><button id="reveal">图标常显：关</button><button id="restart">重新摆一篮</button></div><div class="caption">本题用简化护理卡构成记忆配对，配对条件由本题给定。外观不代表真实材质；真实衣物和设备请以护理标签及说明书为准。没有时间限制，不宣称认知疗效。</div></main>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><script>
const el=id=>document.getElementById(id);const groups=[{code:'A',title:'温和洗 · 低温烘',wash:'温和洗',dry:'低温烘',symbol:'○',color:'#d89f7b'},{code:'B',title:'轻柔洗 · 低温烘',wash:'轻柔洗',dry:'低温烘',symbol:'△',color:'#9eafa5'},{code:'C',title:'温和洗 · 另行晾干',wash:'温和洗',dry:'另行晾干',symbol:'□',color:'#a6b5c5'},{code:'D',title:'轻柔洗 · 另行晾干',wash:'轻柔洗',dry:'另行晾干',symbol:'◇',color:'#c2a6af'}];
const items=[['上衣','tee',0],['日常枕套','pillow',0],['轻柔上衣','tee',1],['护理长裤','pants',1],['晾干上衣','tee',2],['晾干围巾','scarf',2],['轻柔裙子','dress',3],['护理披肩','scarf',3]];let level=0,deck=[],opened=[],pairs=[],attempts=0,misses=0,busy=false,always=false,session=0,completed=false,paused=false,timers=new Set();const names=['第一关 · 看懂两组','第二关 · 记住三个位置关系','第三关 · 比较两项护理条件'];
function art(type,color){const shapes={tee:'<path d="M29 14L13 27l11 17 9-6v36h35V38l9 6 11-17-18-13-10 8H40z"/>',pillow:'<rect x="14" y="18" width="72" height="53" rx="12"/><path d="M23 27h54v35H23z" fill="#fff5df" opacity=".5"/>',pants:'<path d="M29 12h44l4 65H56l-6-43-6 43H24z"/><path d="M29 22h43M50 14v18" fill="none" stroke="#fff1d8"/>',scarf:'<path d="M26 13h27l2 31 22 17-13 19-35-29z"/><path d="M33 21h16m-13 8h14m9 34 10 7" fill="none" stroke="#fff1d8" stroke-width="4"/>',dress:'<path d="M35 12h29l-5 24 22 39H18l22-39z"/><path d="M40 36h19M37 21h25" fill="none" stroke="#fff1d8" stroke-width="4"/>'};return '<svg viewBox="0 0 100 90" aria-hidden="true"><ellipse cx="50" cy="81" rx="30" ry="5" fill="#9c7649" opacity=".13"/><g fill="'+color+'" stroke="#a0876d" stroke-width="2" stroke-linejoin="round">'+shapes[type]+'</g></svg>'}
function careIcon(kind){const paths={wash:'<path d="M5 10l3 20h24l3-20M8 16q5-5 10 0t14 0"/>',gentle:'<path d="M9 31C8 10 20 4 32 5c0 15-7 24-23 26zm0 0L26 12m-9 9 10 1"/>',dry:'<rect x="5" y="5" width="30" height="30" rx="5"/><circle cx="20" cy="20" r="10"/><circle cx="20" cy="20" r="2" fill="currentColor"/>',air:'<path d="M17 12q0-7 6-5t-1 10v4L5 31h30L22 21"/>'};return '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">'+paths[kind]+'</g></svg>'}
function careBadges(g){return '<span class="care-badges"><span class="care-badge '+(g.wash==='轻柔洗'?'gentle':'wash')+'">'+careIcon(g.wash==='轻柔洗'?'gentle':'wash')+'<span>'+(g.wash==='轻柔洗'?'轻柔':'温和')+'</span></span><span class="care-badge '+(g.dry==='低温烘'?'dry':'air')+'">'+careIcon(g.dry==='低温烘'?'dry':'air')+'<span>'+(g.dry==='低温烘'?'低温烘':'晾干')+'</span></span></span>'}
function arrange(cards,l){let d;for(let tries=0;tries<1000;tries++){d=shuffle([...cards]);if(l===0||d.every((c,i)=>i===0||c.group!==d[i-1].group))return d}throw Error('无法生成关卡牌序')}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function tell(t){el('message').textContent=t}function later(f,ms){const id=setTimeout(()=>{timers.delete(id);f()},ms);timers.add(id)}function clearTimers(){timers.forEach(clearTimeout);timers.clear()}
function render(){el('level').textContent=names[level];el('progress').textContent=pairs.length+' / '+(level+2)+' 批';el('bar').style.width=100*pairs.length/(level+2)+'%';el('cards').className='cards '+(level===2?'compact':'');el('cards').innerHTML=deck.map((c,i)=>{let matched=pairs.includes(c.group),face=always||opened.includes(i)||matched,g=groups[c.group];return '<button class="card '+(matched?'matched':face?'selected':'back')+'" data-card="'+i+'" aria-label="'+(matched?'已成批':face?c.name+'，'+g.title:'第'+(i+1)+'张未翻开的衣物卡')+'" '+(matched?'disabled':'')+'>'+(face?art(c.type,g.color)+'<span class="name">'+c.name+'</span>'+careBadges(g):'<span class="number">'+(i+1)+'</span><span style="font-size:15px">翻开看看</span>')+'</button>'}).join('');document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>flip(+b.dataset.card));el('reveal').textContent='标签常显：'+(always?'开':'关');el('batches').innerHTML=pairs.map(k=>'<span>✓ '+groups[k].title+'</span>').join('');el('basket').textContent=pairs.length?'已安排 '+pairs.length+' 批':'找到相容搭档'}
function begin(l){clearTimers();session++;level=l;opened=[];pairs=[];attempts=misses=0;busy=false;completed=false;paused=false;deck=arrange(items.slice(0,(l+2)*2).map((a,id)=>({name:a[0],type:a[1],group:a[2],id})),l);hide();render();tell(['第一关：找出两个图标都相同的搭档。','第二关：6张卡。搭档分开放，留意位置。','第三关：8张卡。相似组合，只差一个图标。'][l])}
function flip(i){if(busy||paused||completed||opened.includes(i)||pairs.includes(deck[i].group))return;opened.push(i);render();if(opened.length<2){tell('找另一张：两个图标都一样。');return}attempts++;const [a,b]=opened;busy=true;const current=session;if(deck[a].group===deck[b].group){tell('两个图标相同，配对成功！');el('drum').classList.add('spin');later(()=>{if(current!==session)return;pairs.push(deck[a].group);opened=[];busy=false;el('drum').classList.remove('spin');render();if(pairs.length===level+2)finish();else tell('这一批安排好了。找找下一组搭档。')},650)}else{misses++;tell('图标不同，记住位置再试。');later(()=>{if(current!==session)return;opened=[];busy=false;render()},1800)}}
function show(html){paused=true;el('panel').innerHTML=html;el('overlay').classList.remove('hidden')}function hide(){paused=false;el('overlay').classList.add('hidden')}function finish(){completed=true;show('<small>第 '+(level+1)+' 关 · 已完成</small><h2>这一篮，安排好了。</h2><div class="result"><div><strong>'+pairs.length+'</strong>合适批次</div><div><strong>'+attempts+'</strong>配对尝试</div></div><p>'+ (misses?'有 '+misses+' 次条件不同的尝试，最后都找到了搭档。':'每次都找到了相容搭档！')+'</p><p class="muted">'+(always?'本次使用标签常显模式，同样可以继续。':'你通过位置记忆和条件比较完成了安排。')+'</p><div class="actions"><button class="primary" id="next">'+(level<2?'准备好了，进入下一关':'三关完成，再玩一篮')+'</button><button id="again">再玩本关</button></div>');el('next').onclick=()=>begin(level<2?level+1:0);el('again').onclick=()=>begin(level)}
function intro(){show('<small>暖色记忆配对 · 可随时查阅</small><h2>衣物不同，也能成为搭档。</h2><p>每次翻两张，<strong>两个图标都一样</strong>就能配对。</p><p>记住位置，找出搭档。没有时间限制。</p><p class="muted">想轻松一点，可开启“标签常显”，把记忆题改为观察配对。</p><button class="primary" id="start">先试4张卡 →</button>');el('start').onclick=()=>begin(0)}
el('reveal').onclick=()=>{always=!always;render();tell(always?'标签保持可见，慢慢比较也能完成。':'标签恢复翻面，已选的卡仍保持可见。')};el('restart').onclick=()=>{show('<h2>重新摆这一篮？</h2><p>卡片位置会重新打乱，其他关卡不受影响。</p><div class="actions"><button id="yes" class="primary">重新摆一篮</button><button id="cancel">保留进度，继续</button></div>');el('yes').onclick=()=>begin(level);el('cancel').onclick=hide};el('guide').onclick=()=>{show('<h2>生活指南 · 本题护理卡</h2><p>衣物外观不决定护理方式，请比较两项条件：</p>'+groups.slice(0,level+2).map(g=>'<div class="legend">'+careBadges(g)+'</div>').join('')+'<p class="muted">“另行晾干”表示这批不进入烘干。动画只展示匹配结果，不模拟实际机器运行时长。</p><button id="back" class="primary">回到这一篮</button>');el('back').onclick=hide};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!completed&&deck.length){show('<h2>先休息一下</h2><p>卡片的位置保持不变，准备好了继续。</p><button id="resume" class="primary">继续这一篮</button>');el('resume').onclick=hide}});intro();
</script></html>
